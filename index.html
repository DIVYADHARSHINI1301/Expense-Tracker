<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a2332" />
    <meta name="description" content="Expensio — Modern expense tracker. Manage income, expenses, budget and analytics." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expensio" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Expensio — Modern Expense Tracker</title>
    <style>
      #splash {
        position:fixed;inset:0;z-index:9999;
        background:#1a2332;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:20px;
        transition:opacity 0.5s ease, transform 0.5s ease;
      }
      #splash.hide { opacity:0; transform:scale(1.06); pointer-events:none; }
      .sp-logo {
        width:80px;height:80px;border-radius:22px;
        background:#1a2332;
        display:flex;align-items:center;justify-content:center;
        animation:spPop 0.6s cubic-bezier(0.22,1,0.36,1) both;
      }
      .sp-name {
        font-family:'Poppins',sans-serif;font-weight:800;
        font-size:28px;letter-spacing:0.04em;
        color:#fff;
        animation:spFade 0.7s 0.2s ease both;
      }
      .sp-name span { color:#4a9eff; }
      .sp-sub {
        font-family:'Inter',sans-serif;font-size:12px;
        color:#8a9bb0;letter-spacing:0.12em;text-transform:uppercase;
        animation:spFade 0.7s 0.35s ease both;
      }
      .sp-bar {
        width:120px;height:3px;border-radius:99px;
        background:#2a3a4e;overflow:hidden;
        animation:spFade 0.7s 0.45s ease both;
      }
      .sp-bar-fill {
        height:100%;border-radius:99px;
        background:linear-gradient(90deg,#4a9eff,#4ade80);
        animation:spLoad 1.4s 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
        width:0%;
      }
      @keyframes spPop {
        from{opacity:0;transform:scale(0.7) translateY(16px);}
        to{opacity:1;transform:scale(1) translateY(0);}
      }
      @keyframes spFade {
        from{opacity:0;transform:translateY(10px);}
        to{opacity:1;transform:translateY(0);}
      }
      @keyframes spLoad {
        from{width:0%;}to{width:100%;}
      }
      @keyframes spDot {
        0%,80%,100%{transform:scaleY(0.4);opacity:0.4;}
        40%{transform:scaleY(1.3);opacity:1;}
      }
      .sp-dots{display:flex;gap:5px;align-items:flex-end;height:18px;animation:spFade 0.7s 0.5s ease both;}
      .sp-dot{width:4px;border-radius:2px;background:#4a9eff;}
      .sp-dot:nth-child(1){height:10px;animation:spDot 1.1s 0.0s ease-in-out infinite;}
      .sp-dot:nth-child(2){height:14px;animation:spDot 1.1s 0.15s ease-in-out infinite;}
      .sp-dot:nth-child(3){height:18px;animation:spDot 1.1s 0.3s ease-in-out infinite;}
      .sp-dot:nth-child(4){height:14px;animation:spDot 1.1s 0.45s ease-in-out infinite;}
      .sp-dot:nth-child(5){height:10px;animation:spDot 1.1s 0.6s ease-in-out infinite;}
    </style>
  </head>
  <body>
    <!-- Splash screen (removed by JS after React mounts) -->
    <div id="splash">
      <div class="sp-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="80" height="80">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0f2744"/>
              <stop offset="100%" stop-color="#1a2332"/>
            </linearGradient>
            <linearGradient id="a" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4a9eff"/>
              <stop offset="60%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#4ade80"/>
            </linearGradient>
            <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="120" fill="url(#bg)"/>
          <rect x="8" y="8" width="496" height="496" rx="114" fill="none" stroke="#4a9eff" stroke-width="3" opacity="0.18"/>
          <!-- Bold E -->
          <rect x="130" y="118" width="58" height="276" rx="18" fill="url(#a)"/>
          <rect x="130" y="118" width="240" height="58" rx="18" fill="url(#a)"/>
          <rect x="130" y="227" width="190" height="52" rx="16" fill="url(#a)"/>
          <rect x="130" y="336" width="240" height="58" rx="18" fill="url(#a)"/>
          <!-- Coin accent -->
          <circle cx="368" cy="368" r="68" fill="url(#coin)" opacity="0.15"/>
          <circle cx="368" cy="368" r="52" fill="url(#coin)"/>
          <text x="368" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="52" fill="#1a2332">&#x20b9;</text>
        </svg>
      </div>
      <div class="sp-name">Expen<span>sio</span></div>
      <div class="sp-sub">Modern Expense Tracker</div>
      <div class="sp-dots">
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
        <div class="sp-dot"></div>
      </div>
      <div class="sp-bar"><div class="sp-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove splash after React hydrates
      window.__removeSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 520); }
      };
    </script>
  </body>
</html>
