<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- App icon background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Subtle inner glow ring -->
  <rect x="8" y="8" width="496" height="496" rx="114" fill="none" stroke="#4a9eff" stroke-width="3" opacity="0.18"/>

  <!-- Bold "E" letterform -->
  <!-- Vertical spine -->
  <rect x="130" y="118" width="58" height="276" rx="18" fill="url(#a)"/>
  <!-- Top bar -->
  <rect x="130" y="118" width="240" height="58" rx="18" fill="url(#a)"/>
  <!-- Middle bar (shorter = classic E) -->
  <rect x="130" y="227" width="190" height="52" rx="16" fill="url(#a)"/>
  <!-- Bottom bar -->
  <rect x="130" y="336" width="240" height="58" rx="18" fill="url(#a)"/>

  <!-- Coin accent — bottom right -->
  <circle cx="368" cy="368" r="68" fill="url(#coin)" opacity="0.15"/>
  <circle cx="368" cy="368" r="52" fill="url(#coin)"/>
  <text x="368" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="52" fill="#1a2332">₹</text>
</svg>
